# DefectCon search with VF over widened ranges (Appendix B, Section 5.5).
study_name: final_vf3            # study name stored in results/tuning/final_vf3.journal
condition: vf
n_trials: 20
n_startup_trials: 7
pruner_warmup_blocks: 14
space:
  lr: [3.0e-5, 3.0e-4, true]
  focal_gamma: [0.5, 3.0, false]
  contrastive_weight: [0.1, 6.0, true]
  temperature: [0.18, 0.50, false]
defects_per_batch: [48, 64, 80, 96]
