# DefectCon hyperparameter search with VF (Appendix B, Table B).
study_name: final_vf             # study name stored in results/tuning/final_vf.journal
condition: vf
n_trials: 20
n_startup_trials: 7
pruner_warmup_blocks: 14
space:
  lr: [1.0e-4, 1.0e-3, true]
  focal_gamma: [1.0, 5.0, false]
  contrastive_weight: [0.1, 3.0, true]
  temperature: [0.05, 0.25, false]
defects_per_batch: [16, 32, 48, 64]
